<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR Waiver Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">SCR</div><div><b>Waiver Desk</b><small>Old Republic Title</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="ttl"><h1 id="ptitle">Dashboard</h1><div class="crumb" id="pcrumb"></div></div>
      <div class="grow"></div>
      <label class="searchbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="gsearch" placeholder="Search vendor, file #, or SCR entry"><kbd>/</kbd></label>
      <select class="select" id="gproject" title="Filter by title file"></select>
      <div class="userchip" title="Signed in as (requestor)"><span id="meav"></span><select id="me"></select></div>
      <a class="btn primary" href="#/new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Request</a>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel"></aside>
<div class="modal" id="modal"></div>
<div class="bulk" id="bulk"></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
